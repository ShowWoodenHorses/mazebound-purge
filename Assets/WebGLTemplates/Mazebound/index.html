<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    {{{ MAZE_PLATFORM_HEAD }}}
    <style>
      /* No scrollbars, no page gestures: the game is the whole page (platform rules). */
      html, body {
        margin: 0; padding: 0; border: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #191714;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #unity-canvas {
        position: fixed; left: 0; top: 0;
        width: 100%; height: 100%;
        display: block;
        outline: none;
        background: #191714;
        touch-action: none;
      }
      #loader {
        position: fixed; left: 0; top: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #191714;
        color: #ece6d6;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        transition: opacity 0.3s;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #title {
        font-size: min(9vw, 64px); font-weight: 700; letter-spacing: 0.18em;
        margin-left: 0.18em; /* balances the letter spacing after the last letter */
        text-transform: uppercase;
      }
      #bar {
        width: min(60vw, 420px); height: 3px; margin-top: 28px;
        background: rgba(236, 230, 214, 0.18);
      }
      #fill { width: 0; height: 100%; background: #e9b64f; transition: width 0.15s; }
      #error {
        display: none; max-width: 80vw; margin-top: 24px;
        font-size: 16px; line-height: 1.4; text-align: center; color: #c9503f;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div id="title">{{{ PRODUCT_NAME }}}</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="error"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.getElementById('unity-canvas');
      var loader = document.getElementById('loader');
      var fill = document.getElementById('fill');
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)); // iPadOS reports a Mac

      // Keys and touches stay in the game: no page scroll, context menu, text selection, zoom or pull-to-refresh.
      var gameKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab', 'PageUp', 'PageDown', 'Home', 'End'];
      window.addEventListener('keydown', function (e) { if (gameKeys.indexOf(e.key) >= 0) e.preventDefault(); });
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('selectstart', function (e) { e.preventDefault(); });
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }); // Safari pinch
      document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      document.addEventListener('dblclick', function (e) { e.preventDefault(); });
      // Keyboard focus to the game on any touch or click (inside a platform's frame too).
      document.addEventListener('pointerdown', function () { window.focus(); canvas.focus(); });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Phones have 2.5-3.5x screens: rendering at all of it costs FPS and battery for little visible gain.
        devicePixelRatio: mobile ? Math.min(window.devicePixelRatio || 1, 2) : (window.devicePixelRatio || 1),        showBanner: function (message, type) {
          if (type === 'error') showError(message);
        },
      }, function (progress) {
        fill.style.width = Math.round(progress * 100) + '%';
      }).then(function () {
        fill.style.width = '100%';
        loader.classList.add('done');
        canvas.focus();
        setTimeout(function () { loader.style.display = 'none'; }, 400);
      }).catch(showError);

      function showError(message) {
        var error = document.getElementById('error');
        error.textContent = String(message);
        error.style.display = 'block';
      }
    </script>
  </body>
</html>
